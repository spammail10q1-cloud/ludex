name: Build Ludex (Windows + Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ludex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
            script: dist-linux
          - target: windows-x64
            runner: windows-latest
            script: dist
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CI: "true"
      HUSKY: "0"
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: yarn

      - run: npm install --global yarn@1.22.22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            binaries/AscendaraDownloader/target
            binaries/AscendaraGameHandler/target
            binaries/AscendaraCrashReporter/target
          key: ludex-cargo-${{ matrix.target }}-1.90.0-${{ hashFiles('binaries/AscendaraDownloader/Cargo.lock', 'binaries/AscendaraGameHandler/Cargo.lock', 'binaries/AscendaraCrashReporter/Cargo.lock') }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev libssl-dev pkg-config

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Compile Windows helpers
        if: runner.os == 'Windows'
        run: python scripts/build_windows_helpers.py

      - name: Build Ludex
        shell: bash
        env:
          BUILD_SECRET: ${{ secrets.BUILD_SECRET || 'ludex-community-build' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            yarn dist-linux --skip-registration
          else
            yarn dist --skip-registration
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find dist -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp {} release-artifacts/ \;
          ls -lh release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ludex-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ludex-*
          path: release-assets
          merge-multiple: true

      - name: Build portable USB packages
        shell: bash
        run: |
          mkdir -p usb-linux usb-windows
          cp release-assets/*linux*.AppImage usb-linux/Ludex.AppImage
          cp portable/LudexPortable.sh portable/README.txt usb-linux/
          cp release-assets/*Portable*.exe usb-windows/Ludex.exe
          cp portable/LudexPortable.bat portable/README.txt usb-windows/
          chmod +x usb-linux/LudexPortable.sh
          (cd usb-linux && zip -r ../release-assets/Ludex-USB-Linux.zip .)
          (cd usb-windows && zip -r ../release-assets/Ludex-USB-Windows.zip .)
          ls -lh release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
