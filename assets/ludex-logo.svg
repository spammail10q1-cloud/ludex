<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161726"/>
      <stop offset="55%" stop-color="#10111c"/>
      <stop offset="100%" stop-color="#0a0b13"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#b8f4ff"/>
      <stop offset="28%" stop-color="#7ae7ff"/>
      <stop offset="62%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#b18cff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8f4ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.64  0 0 0 0 1  0 0 0 1 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="1024" height="1024" rx="228"/>
    </clipPath>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#grid)"/>
    <ellipse cx="512" cy="430" rx="430" ry="360" fill="url(#halo)"/>
    <path d="M -120 780 C 180 560, 520 520, 1140 250" stroke="#ffffff" stroke-opacity="0.035" stroke-width="90" fill="none"/>
    <path d="M 250 940 C 520 760, 720 700, 1100 620" stroke="#7ae7ff" stroke-opacity="0.06" stroke-width="70" fill="none"/>
  </g>

  <rect x="6" y="6" width="1012" height="1012" rx="224" fill="none" stroke="url(#edge)" stroke-width="6"/>

  <!-- orbit accents -->
  <circle cx="512" cy="500" r="350" fill="none" stroke="#7ae7ff" stroke-opacity="0.10" stroke-width="4"/>
  <circle cx="512" cy="500" r="350" fill="none" stroke="#b18cff" stroke-opacity="0.08" stroke-width="14" stroke-dasharray="24 96" stroke-linecap="round" transform="rotate(-24 512 500)"/>

  <!-- L mark -->
  <g filter="url(#glow)">
    <path d="M 330 248 Q 300 248 300 278 L 300 686 Q 300 716 330 716 L 700 716 Q 730 716 730 686 L 730 558 Q 730 528 700 528 L 470 528 L 470 278 Q 470 248 440 248 Z" fill="url(#mark)"/>
  </g>
  <path d="M 330 248 Q 300 248 300 278 L 300 686 Q 300 716 330 716 L 700 716 Q 730 716 730 686 L 730 558 Q 730 528 700 528 L 470 528 L 470 278 Q 470 248 440 248 Z" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>

  <!-- play triangle -->
  <g filter="url(#glow)">
    <path d="M 548 330 Q 548 306 570 319 L 694 386 Q 716 399 694 412 L 570 479 Q 548 492 548 468 Z" fill="url(#play)"/>
  </g>
  <path d="M 548 330 Q 548 306 570 319 L 694 386 Q 716 399 694 412 L 570 479 Q 548 492 548 468 Z" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>

  <!-- highlight -->
  <path d="M 120 180 Q 400 40 820 140" stroke="#ffffff" stroke-opacity="0.12" stroke-width="16" fill="none" stroke-linecap="round"/>
</svg>
